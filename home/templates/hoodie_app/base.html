<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hoodie Co.{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="sticky top-0 bg-white border-b z-10">
    <div class="max-w-md md:max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{% url 'hoodie_app:home' %}" class="font-semibold text-lg">Hoodie Co.</a>
      <span class="text-xs text-gray-400 hidden md:inline">Cash on delivery &middot; Nationwide</span>
    </div>
  </header>

  <main class="max-w-md md:max-w-5xl mx-auto px-4 py-4 md:py-8">
    {% if messages %}
      {% for message in messages %}
        <div class="mb-3 text-sm rounded-md bg-amber-50 text-amber-800 px-3 py-2">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
